name: Android prep
description: >-
  Persiapan build Android MyWallet: bebas disk, Java 17, Flutter, tuning
  Gradle CI, NDK anti-korup, restore google-services.json, dan keystore
  rilis. Dipakai build.yml / build-apk.yml / release.yml supaya tidak ada
  blok yang disalin tiga kali.

inputs:
  flutter-version:
    description: Versi Flutter (samakan dengan versi yang dipakai repo).
    required: false
    default: "3.44.4"
  google-services-base64:
    description: >-
      Isi android/app/google-services.json dalam base64. Kosong = langkah
      ini dilewati (build tanpa Firebase akan gagal saat plugin dipakai,
      jadi isi untuk build Android sungguhan).
    required: false
    default: ""
  keystore-base64:
    description: >-
      Isi android/app/mywallet.keystore dalam base64. Kosong = langkah ini
      dilewati dan build memakai debug key (APK tidak bisa menimpa instalasi
      dari Obtainium — signature mismatch).
    required: false
    default: ""
  keystore-password:
    description: Password keystore. Wajib bila keystore-base64 diisi.
    required: false
    default: ""
  key-alias:
    description: Alias key rilis. Wajib bila keystore-base64 diisi.
    required: false
    default: ""
  key-password:
    description: Password key rilis. Wajib bila keystore-base64 diisi.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Cegah "No space left on device" (insiden rilis v1.12.1).
    - name: Bebaskan disk runner (anti penuh)
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: false
        dotnet: true
        haskell: true
        large-packages: false
        docker-images: true
        swap-storage: false

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"
        cache: gradle

    - uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: ${{ inputs.flutter-version }}
        cache: true

    # Runner cloud RAM 16GB: pakai setting kencang.
    # (android/gradle.properties di repo diset hemat 2GB buat laptop RAM
    #  kecil — setting itu yang bikin build cloud ikut lambat, jadi timpa.)
    - name: Tune Gradle for CI (fast)
      shell: bash
      run: |
        cat > android/gradle.properties <<'EOF'
        org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
        org.gradle.workers.max=4
        org.gradle.parallel=true
        org.gradle.caching=true
        kotlin.incremental=true
        android.useAndroidX=true
        android.newDsl=false
        android.builtInKotlin=false
        EOF

    # NDK di runner sering korup saat diunduh (ZipException flaky).
    # Pasang eksplisit dengan retry agar Gradle tidak unduh dadakan dan
    # gagal di tengah jalan. Versi NDK = flutter.ndkVersion untuk Flutter
    # 3.44.4 (cek ulang saat bump Flutter).
    # (Kejadian: rilis v1.8.0 lolos via rerun, v1.9.0 gagal lagi dengan
    #  pola sama — murni infra, bukan kode.)
    - name: Pasang NDK dengan retry (anti-korup)
      shell: bash
      run: |
        SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
        NDK_VER="28.2.13676358"
        MGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
        for i in 1 2 3 4 5; do
          echo "== NDK attempt $i =="
          rm -rf "$SDK/ndk/$NDK_VER" "$SDK/.temp"
          if yes | "$MGR" --install "ndk;$NDK_VER"; then
            break
          fi
          echo "NDK install gagal, coba lagi..."
          sleep 15
        done
        test -f "$SDK/ndk/$NDK_VER/source.properties"

    # Plugin google-services butuh file ini saat build (di-gitignore).
    - name: Siapkan google-services.json (Firebase)
      if: inputs.google-services-base64 != ''
      shell: bash
      run: |
        printf '%s' "${{ inputs.google-services-base64 }}" \
          | base64 --decode > android/app/google-services.json
        test -s android/app/google-services.json

    # Tanpa keystore, APK rilis = tanda tangan debug → GAGAL install
    # menimpa app dari Obtainium (signature mismatch).
    - name: Siapkan keystore rilis
      if: inputs.keystore-base64 != ''
      shell: bash
      run: |
        printf '%s' "${{ inputs.keystore-base64 }}" \
          | base64 --decode > android/app/mywallet.keystore
        {
          echo "storePassword=${{ inputs.keystore-password }}"
          echo "keyPassword=${{ inputs.key-password }}"
          echo "keyAlias=${{ inputs.key-alias }}"
          echo "storeFile=app/mywallet.keystore"
        } > android/key.properties
