name: Release MyWallet

# Dipicu saat push tag v* ATAU manual (wajib isi tag).
# Hasil: GitHub Release berisi APK rilis bertanda tangan (+ AAB buat Play Console).
# Obtainium di HP memantau halaman Releases ini untuk auto-update.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag rilis baru (contoh: v1.0.1)"
        required: true

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.4"
          cache: true

      # Runner cloud RAM 16GB: pakai setting kencang (lihat build.yml).
      - name: Tune Gradle for CI (fast)
        run: |
          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.workers.max=4
          org.gradle.parallel=true
          org.gradle.caching=true
          kotlin.incremental=true
          android.useAndroidX=true
          android.newDsl=false
          android.builtInKotlin=false
          EOF

      # NDK di runner kadang korup (unduhan parsial dari jaringan):
      # hapus dulu agar AGP mengunduh ulang bersih.
      # (Kejadian: rilis v1.8.0 gagal CXX1101 + ZipException
      #  padahal analyze+test lolos — murni infra, bukan kode.)
      - name: Bersihkan NDK korup (unduh ulang bersih)
        run: rm -rf "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/ndk"

      - name: Tentukan tag rilis
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Siapkan keystore rilis
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/mywallet.keystore
          {
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "storeFile=app/mywallet.keystore"
          } > android/key.properties

      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - run: flutter build appbundle --release

      - name: Siapkan nama file rilis
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "mywallet-${{ steps.tag.outputs.value }}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "mywallet-${{ steps.tag.outputs.value }}.aab"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: MyWallet ${{ steps.tag.outputs.value }}
          generate_release_notes: true
          files: |
            mywallet-${{ steps.tag.outputs.value }}.apk
            mywallet-${{ steps.tag.outputs.value }}.aab
