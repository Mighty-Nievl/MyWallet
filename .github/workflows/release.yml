name: Release MyWallet

# Dipicu saat push tag v* ATAU manual (wajib isi tag).
# Hasil: GitHub Release berisi APK rilis bertanda tangan (+ AAB buat Play Console).
# Obtainium di HP memantau halaman Releases ini untuk auto-update.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag rilis baru (contoh: v1.0.1)"
        required: true

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Runner Ubuntu kehabisan disk saat assembleRelease (No space left).
      # Bebaskan ~15GB dari tool preinstalled yang tidak dipakai
      # (dotnet, haskell, docker images). Android SDK JANGAN dihapus.
      - name: Bebaskan disk runner (anti penuh)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.4"
          cache: true

      # Runner cloud RAM 16GB: pakai setting kencang (lihat build.yml).
      - name: Tune Gradle for CI (fast)
        run: |
          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.workers.max=4
          org.gradle.parallel=true
          org.gradle.caching=true
          kotlin.incremental=true
          android.useAndroidX=true
          android.newDsl=false
          android.builtInKotlin=false
          EOF

      # NDK di runner sering korup saat diunduh (ZipException flaky).
      # Pasang eksplisit dengan retry agar Gradle tidak unduh dadakan
      # dan gagal di tengah jalan. Versi NDK = flutter.ndkVersion
      # untuk Flutter 3.44.4 (cek ulang saat bump Flutter).
      # (Kejadian: rilis v1.8.0 lolos via rerun, v1.9.0 gagal lagi
      #  dengan pola sama — murni infra, bukan kode.)
      - name: Pasang NDK dengan retry (anti-korup)
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          NDK_VER="28.2.13676358"
          MGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          for i in 1 2 3 4 5; do
            echo "== NDK attempt $i =="
            rm -rf "$SDK/ndk/$NDK_VER" "$SDK/.temp"
            if yes | "$MGR" --install "ndk;$NDK_VER"; then
              break
            fi
            echo "NDK install gagal, coba lagi..."
            sleep 15
          done
          test -f "$SDK/ndk/$NDK_VER/source.properties"

      - name: Tentukan tag rilis
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Siapkan keystore rilis
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/mywallet.keystore
          {
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "storeFile=app/mywallet.keystore"
          } > android/key.properties

      # Firebase (Fase 1): google-services.json di-gitignore, restore dari
      # secret agar build cloud jalan (plugin google-services butuh file
      # ini saat build). Gagal cepat bila secret belum diisi.
      - name: Siapkan google-services.json (Firebase)
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json
          test -s android/app/google-services.json

      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - run: flutter build appbundle --release

      - name: Siapkan nama file rilis
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "mywallet-${{ steps.tag.outputs.value }}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "mywallet-${{ steps.tag.outputs.value }}.aab"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: MyWallet ${{ steps.tag.outputs.value }}
          generate_release_notes: true
          files: |
            mywallet-${{ steps.tag.outputs.value }}.apk
            mywallet-${{ steps.tag.outputs.value }}.aab
