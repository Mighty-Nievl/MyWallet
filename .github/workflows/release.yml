name: Release MyWallet

# Dipicu saat push tag v* ATAU manual (wajib isi tag).
# Hasil: GitHub Release berisi APK rilis bertanda tangan (+ AAB buat Play Console).
# Obtainium di HP memantau halaman Releases ini untuk auto-update.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag rilis baru (contoh: v1.0.1)"
        required: true

jobs:
  release:
    name: Build & Publish Release
    runs-on: instabox-medium
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Disk, Java 17, Flutter, tuning Gradle, NDK anti-korup, keystore,
      # google-services.json — semua dari composite action bersama
      # (.github/actions/android-prep), biar tidak ada blok yang disalin
      # ke tiga workflow.
      # Catatan lama: runner Ubuntu kehabisan disk saat assembleRelease
      # (No space left) → action ini membebaskan ~15GB tool preinstalled
      # (dotnet, haskell, docker images); Android SDK JANGAN dihapus.
      - uses: ./.github/actions/android-prep
        with:
          keystore-base64: ${{ secrets.KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.KEY_ALIAS }}
          key-password: ${{ secrets.KEY_PASSWORD }}
          google-services-base64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}

      - name: Tentukan tag rilis
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - run: flutter build appbundle --release

      - name: Siapkan nama file rilis
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "mywallet-${{ steps.tag.outputs.value }}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "mywallet-${{ steps.tag.outputs.value }}.aab"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: MyWallet ${{ steps.tag.outputs.value }}
          generate_release_notes: true
          files: |
            mywallet-${{ steps.tag.outputs.value }}.apk
            mywallet-${{ steps.tag.outputs.value }}.aab
