name: Release MyWallet

# Dipicu saat push tag v* ATAU manual (wajib isi tag).
# Hasil: GitHub Release berisi APK rilis bertanda tangan (+ AAB buat Play Console).
# Obtainium di HP memantau halaman Releases ini untuk auto-update.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag rilis baru (contoh: v1.0.1)"
        required: true

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.4"

      - name: Tentukan tag rilis
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Siapkan keystore rilis
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/mywallet.keystore
          {
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "storeFile=app/mywallet.keystore"
          } > android/key.properties

      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - run: flutter build appbundle --release

      - name: Siapkan nama file rilis
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "mywallet-${{ steps.tag.outputs.value }}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "mywallet-${{ steps.tag.outputs.value }}.aab"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: MyWallet ${{ steps.tag.outputs.value }}
          generate_release_notes: true
          files: |
            mywallet-${{ steps.tag.outputs.value }}.apk
            mywallet-${{ steps.tag.outputs.value }}.aab
