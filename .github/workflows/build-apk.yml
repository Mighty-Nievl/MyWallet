name: Fast Flutter APK Build

# APK rilis (signed keystore resmi) untuk cek cepat di HP — MANUAL saja.
#
# Sejak v1.33.0 workflow ini tidak lagi jalan tiap push ke main: build
# Android per-push sudah cukup satu (build.yml, APK debug). Sebelumnya
# tiap push menabrak dua build Android sekaligus dengan artifact yang
# beda tipis. Analyze + test tetap di build.yml / release.yml; workflow
# ini sengaja build-only biar antreannya pendek.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK rilis (signed)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Disk, Java 17, Flutter, tuning Gradle, NDK anti-korup, keystore,
      # google-services.json — semuanya dari composite action bersama.
      - uses: ./.github/actions/android-prep
        with:
          keystore-base64: ${{ secrets.KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.KEY_ALIAS }}
          key-password: ${{ secrets.KEY_PASSWORD }}
          google-services-base64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}

      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mywallet-apk-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 3
