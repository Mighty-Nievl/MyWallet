name: Check MyWallet

# v1.36.0: push ke main TIDAK lagi memicu workflow ini (hemat menit —
# dulu tiap commit = analyze + test + build APK debug). Sekarang:
# - PR ke main  : analyze + test (gerbang review).
# - Manual      : analyze + test (cek cepat tanpa merilis).
# - Rilis       : push tag v* → release.yml (analyze + test + APK/AAB
#                 bertanda tangan + GitHub Release). Satu pipeline saja.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Push/PR baru membatalkan run lama di ref yang sama (hemat menit + antrean).
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.4"
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter analyze
      - run: flutter test test/account_archive_test.dart test/transfer_integrity_test.dart test/transfer_sheet_test.dart test/fresh_install_test.dart test/account_carousel_test.dart -r expanded --timeout 45s
