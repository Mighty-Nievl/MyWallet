name: Build MyWallet

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Push baru membatalkan build lama di ref yang sama (hemat menit + antrean).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.4"
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter analyze
      - run: flutter test

  build-android:
    name: Build APK & AAB
    runs-on: ubuntu-latest
    needs: analyze-test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Cegah "No space left on device" seperti di rilis v1.12.1.
      - name: Bebaskan disk runner (anti penuh)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.4"
          cache: true

      # Runner cloud RAM 16GB: pakai setting kencang.
      # (android/gradle.properties di repo diset hemat 2GB buat laptop RAM kecil —
      #  setting itu yang bikin build cloud ikut lambat, jadi timpa di sini.)
      - name: Tune Gradle for CI (fast)
        run: |
          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.workers.max=4
          org.gradle.parallel=true
          org.gradle.caching=true
          kotlin.incremental=true
          android.useAndroidX=true
          android.newDsl=false
          android.builtInKotlin=false
          EOF

      # NDK di runner sering korup saat diunduh (ZipException flaky).
      # Pasang eksplisit dengan retry — asuransi yang sama seperti
      # di release.yml, agar build debug/AAB tidak kena juga.
      - name: Pasang NDK dengan retry (anti-korup)
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          NDK_VER="28.2.13676358"
          MGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          for i in 1 2 3 4 5; do
            echo "== NDK attempt $i =="
            rm -rf "$SDK/ndk/$NDK_VER" "$SDK/.temp"
            if yes | "$MGR" --install "ndk;$NDK_VER"; then
              break
            fi
            echo "NDK install gagal, coba lagi..."
            sleep 15
          done
          test -f "$SDK/ndk/$NDK_VER/source.properties"

      # Firebase (Fase 1): google-services.json di-gitignore, restore dari
      # secret agar build cloud jalan. Gagal cepat bila secret belum diisi.
      - name: Siapkan google-services.json (Firebase)
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json
          test -s android/app/google-services.json

      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter build apk --debug
      - run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: mywallet-apk-debug
          path: build/app/outputs/flutter-apk/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mywallet-aab-release
          path: build/app/outputs/bundle/release/app-release.aab
