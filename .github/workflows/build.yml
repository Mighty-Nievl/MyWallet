name: Build MyWallet

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Push baru membatalkan build lama di ref yang sama (hemat menit + antrean).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.4"
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter analyze
      - run: flutter test

  build-debug-apk:
    name: Build APK debug
    runs-on: ubuntu-latest
    needs: analyze-test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Disk, Java 17, Flutter, tuning Gradle, NDK anti-korup,
      # google-services.json — dari composite action bersama. Keystore
      # tidak diisi: APK debug memang bertanda tangan debug.
      - uses: ./.github/actions/android-prep
        with:
          google-services-base64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}

      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: mywallet-apk-debug
          path: build/app/outputs/flutter-apk/app-debug.apk

      # v1.33.0: AAB di sini DIHAPUS. Tanpa keystore rilis, AAB-nya
      # bertanda tangan debug — tidak bisa diunggah ke Play Console dan
      # tidak dipakai siapa pun. AAB resmi dibuat release.yml saat tag.
